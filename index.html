<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kelas Game — Prototype aventure (École)</title>
<style>
:root{--ink:#2b2118;--card:#fff;--acc:#1f7a4d;--gold:#e0a526;--line:#e8dccb;--bg:#fff8ef}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%;overflow:hidden}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:8px;gap:6px}
header{display:flex;justify-content:space-between;align-items:center;font-size:13px}
header b{font-size:16px;letter-spacing:1px}
.tag{background:var(--gold);color:#222;padding:2px 8px;border-radius:10px;font-size:11px}
#world{position:relative;width:100%;aspect-ratio:320/190;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2);user-select:none;touch-action:none}
#world svg{width:100%;height:100%;display:block}
#bubble{position:absolute;top:4%;max-width:60%;background:#fff;color:#222;border-radius:12px;padding:6px 9px;font-size:12px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.25);transform:translateX(-50%);display:none;pointer-events:none;z-index:2}
#bubble:after{content:'';position:absolute;bottom:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
#dlg{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);color:#222;padding:10px 12px;border-top:3px solid var(--gold);display:none;z-index:3;max-height:70%;overflow:auto}
#dlg h3{margin:0 0 4px;font-size:14px;color:var(--acc)}
#dlg p{margin:4px 0 8px;font-size:14px;line-height:1.35}
#dlg button{display:block;width:100%;margin:5px 0;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:15px;text-align:left;cursor:pointer}
#dlg button.p{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center}
#dlg .ko{color:#c0392b;font-size:13px}
#hud{display:flex;gap:8px;align-items:stretch;height:74px}
#hud button{flex:1;border-radius:14px;border:0;font-size:22px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);color:var(--ink);touch-action:none;font-family:inherit}
#hud button#ba{flex:1.6;background:var(--acc);color:#fff;font-size:15px;font-weight:bold}
#hud button#ba:disabled{background:#9bbfae}
#info{font-size:12px;opacity:.8;min-height:16px}
#start{position:absolute;inset:0;background:rgba(255,248,239,.98);display:flex;flex-direction:column;justify-content:center;padding:18px;gap:10px;z-index:5}
#start input{padding:10px;border-radius:10px;border:1px solid var(--line);font:inherit;font-size:16px}
#start button{padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:15px}
#start button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header><b>KELAS GAME</b><span id="place">École LEXARIS ACADÉMIE</span><span class="tag">Prototype</span></header>
  <div id="world">
    <div id="stage" style="position:absolute;inset:0"></div>
    <div id="bubble"></div>
    <div id="dlg"></div>
    <div id="start">
      <h2 style="margin:0">Bienvenue à l’école</h2>
      <p style="margin:0;font-size:14px">Déplace-toi, parle aux personnages et réponds à leurs questions pour apprendre.</p>
      <input id="nom" maxlength="14" placeholder="Ton prénom">
      <div style="display:flex;gap:8px"><button id="fille" class="p" style="flex:1">Une fille</button><button id="garcon" style="flex:1">Un garçon</button></div>
      <button id="go" class="p">Commencer</button>
    </div>
  </div>
  <div id="info"></div>
  <div id="hud">
    <button id="bl" aria-label="Gauche">◀</button>
    <button id="ba">Action</button>
    <button id="br" aria-label="Droite">▶</button>
  </div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <linearGradient id="gSkyQ" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb0ee"/><stop offset="1" stop-color="#e3f6ff"/></linearGradient>
  <linearGradient id="gSkyM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a4c"/><stop offset="1" stop-color="#ffd9a0"/></linearGradient>
  <linearGradient id="gSkyE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fcaf0"/><stop offset="1" stop-color="#eefbf2"/></linearGradient>
  <linearGradient id="gSkyF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb4e6"/><stop offset="1" stop-color="#c4f0ff"/></linearGradient>
  <linearGradient id="gSkyK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a6b"/><stop offset="1" stop-color="#ffe6c9"/></linearGradient>
  <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad977"/><stop offset="1" stop-color="#4f9c3c"/></linearGradient>
  <linearGradient id="gDirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0b47a"/><stop offset="1" stop-color="#b07a43"/></linearGradient>
  <linearGradient id="gRoad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a39a90"/><stop offset="1" stop-color="#6d655e"/></linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4bb0ec"/><stop offset="1" stop-color="#17609e"/></linearGradient>
  <linearGradient id="gTole" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1f6f8"/><stop offset=".5" stop-color="#b9c6cc"/><stop offset="1" stop-color="#7f8f98"/></linearGradient>
  <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b97a4a"/><stop offset="1" stop-color="#7a4a26"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8674a"/><stop offset="1" stop-color="#a8301e"/></linearGradient>
  <linearGradient id="gShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".35" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
  <radialGradient id="gSun"><stop offset="0" stop-color="#fff6a8" stop-opacity="1"/><stop offset="1" stop-color="#ffe07a" stop-opacity="0"/></radialGradient>
  <radialGradient id="gMango" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#e68a00"/></radialGradient>
  <pattern id="pBrick" width="14" height="7" patternUnits="userSpaceOnUse"><rect width="14" height="7" fill="#c46a3c"/><path d="M0 .5H14M0 3.5H14M7 0V3.5M0 3.5V7M14 3.5V7" stroke="#8a4524" stroke-width=".9" fill="none"/></pattern>
  <pattern id="pEarth" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#c58c52"/><circle cx="3" cy="4" r="1.2" fill="#a86f3b"/><circle cx="9" cy="10" r="1" fill="#d9a878"/></pattern>
  <pattern id="pChaume" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d8b56a"/><path d="M0 4H8M4 0V8" stroke="#a88140" stroke-width="1"/></pattern>
  <pattern id="pStripe" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#fff"/><rect width="6" height="10" fill="#c0392b"/></pattern>
  <pattern id="pWax" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#e0a526"/><circle cx="4" cy="4" r="2.2" fill="#1f7a4d"/><circle cx="12" cy="12" r="2.2" fill="#c0392b"/></pattern>
  <g id="mango"><ellipse rx="6" ry="8" fill="url(#gMango)" stroke="#c8741a" stroke-width=".8"/><path d="M0 -8 q4 -6 9 -3" fill="none" stroke="#1f7a4d" stroke-width="2"/></g>
</defs></svg>
<script>
const PEAUX=['#8d5a3b','#5e3b24','#b67a50'];
const AGE_S={enfant:.62,ado:.8,adulte:.95,aine:.92};
const fs=(t,w,m)=>Math.min(m,w/(t.length*0.62));
function cloud(x,y){return `<g fill="#fff" opacity=".85"><ellipse cx="${x}" cy="${y}" rx="22" ry="8"/><ellipse cx="${x+14}" cy="${y-5}" rx="14" ry="9"/></g>`}
function desk(x){return `<rect x="${x-34}" y="122" width="68" height="6" rx="2" fill="#a0683a"/><rect x="${x-30}" y="128" width="4" height="22" fill="#6b4226"/><rect x="${x+26}" y="128" width="4" height="22" fill="#6b4226"/>`}
function gest(g){
  switch(g){
    case 'wave':return['-150;-120;-150','.9s','4;-4;4','2s'];
    case 'point':return['-92;-78;-92','1.2s','4;-4;4','2s'];
    case 'clap':return['0;50;0','.5s','0;-50;0','.5s'];
    case 'talk':return['-25;-8;-25','1.4s','8;-8;8','1.8s'];
    case 'walk':return['-14;14;-14','.7s','14;-14;14','.7s'];
    default:return['3;-3;3','2.4s','-3;3;-3','2.4s'];
  }
}
// p.sit : position assise (jambes horizontales), la hanche reste à la hauteur de l'assise.
function figure(p){
  const w=p.w||1,sk=p.skin||PEAUX[0],tc=p.c||'#2e86de',k=p.k||'uniforme',g=p.g||'idle',HC='#1d130c';
  const trousers=k==='uniforme'||(k==='pagne'&&p.s==='h');
  const longW=k==='boubou',skirt=!longW&&!trousers;
  const bw=17*w,lc=trousers?'#2b2b3a':sk;
  const ani=(v,d,b)=>`<animateTransform attributeName="transform" type="rotate" values="${v}" dur="${d}" repeatCount="indefinite" begin="${b||'0s'}"/>`;
  const [rv,rd,lv,ld]=gest(g);
  let s=`<ellipse cx="0" cy="2" rx="${16*w}" ry="4" fill="#000" opacity=".25"/>`;
  // jambes
  if(!longW&&p.sit){
    [0,1].forEach(i=>{
      const d=i?1:-1;
      s+=`<g transform="translate(${d*5*w},-48)"><line x1="0" y1="0" x2="12" y2="0" stroke="${lc}" stroke-width="${trousers?9*w:6}" stroke-linecap="round"/><line x1="12" y1="0" x2="12" y2="48" stroke="${lc}" stroke-width="${trousers?8*w:5}" stroke-linecap="round"/><ellipse cx="14" cy="49" rx="6" ry="3" fill="#2b1d12"/></g>`;
    });
  }else if(!longW){
    [0,1].forEach(i=>{
      const d=i?1:-1;
      const anim=g==='walk'?ani(i?'16;-16;16':'-16;16;-16','.7s',i?'-0.35s':'0s'):'';
      s+=`<g transform="translate(${d*5*w},-48)"><g>${anim}<line x1="0" y1="0" x2="0" y2="44" stroke="${lc}" stroke-width="${trousers?9*w:6}" stroke-linecap="round"/><ellipse cx="2" cy="46" rx="6" ry="3" fill="#2b1d12"/></g></g>`;
    });
  }
  // tronc et vêtement
  if(longW){
    const path=`M${-bw} -90 Q${-bw-3} -60 ${-bw-8*w} -2 L${bw+8*w} -2 Q${bw+3} -60 ${bw} -90 Z`;
    s+=`<path d="${path}" fill="${tc}"/><path d="${path}" fill="url(#gShade)"/>`;
  }else{
    s+=`<rect x="${-bw}" y="-90" width="${2*bw}" height="46" rx="10" fill="${tc}"/>`;
    if(skirt){
      const f=k==='pagne'?'url(#pWax)':tc;
      s+=`<path d="M${-bw+1} -48 L${-bw-7*w} -6 Q0 2 ${bw+7*w} -6 L${bw-1} -48 Z" fill="${f}"/>`;
    }
    s+=`<rect x="${-bw}" y="-90" width="${2*bw}" height="46" rx="10" fill="url(#gShade)"/>`;
  }
  s+=`<rect x="-4" y="-94" width="8" height="8" fill="${sk}"/>`;
  // bras
  const arm=(side,anim)=>`<g transform="translate(${side*(bw+1)},-84)"><g>${anim}<line x1="0" y1="0" x2="${side*2}" y2="25" stroke="${tc}" stroke-width="${8*w}" stroke-linecap="round"/><line x1="${side*2}" y1="25" x2="${side*3}" y2="40" stroke="${sk}" stroke-width="${6*w}" stroke-linecap="round"/></g></g>`;
  s+=arm(-1,ani(lv,ld))+arm(1,ani(rv,rd));
  if(p.a==='aine')s+=`<line x1="${-bw-6}" y1="-44" x2="${-bw-9}" y2="0" stroke="#7a4a26" stroke-width="2.5" stroke-linecap="round"/>`;
  if(p.montre)s+=`<circle cx="${-bw-6}" cy="-44" r="3" fill="#d9d9d9" stroke="#333" stroke-width="1"/>`;
  // tête et coiffure
  const hb=g==='talk'?ani('-3;3;-3','1.4s'):'';
  const braids=p.co==='nattes'?`<rect x="-13" y="-4" width="4" height="22" rx="2" fill="${HC}"/><rect x="9" y="-4" width="4" height="22" rx="2" fill="${HC}"/><circle cx="-11" cy="18" r="1.6" fill="#e0a526"/><circle cx="11" cy="18" r="1.6" fill="#e0a526"/>`:'';
  let hair;
  if(p.co==='gris')hair=`<path d="M-11.5 0 Q-12.5 -17 0 -17.5 Q12.5 -17 11.5 0 Q7 -9 0 -9.5 Q-7 -9 -11.5 0Z" fill="#d6d6d6"/>`;
  else if(p.co==='tresses')hair=`<path d="M-11.5 0 Q-12.5 -18.5 0 -18.5 Q12.5 -18.5 11.5 0 Q7 -9.5 0 -10 Q-7 -9.5 -11.5 0Z" fill="${HC}"/>`+[-10,-7,7,10].map(x=>`<line x1="${x}" y1="-4" x2="${x}" y2="10" stroke="${HC}" stroke-width="2.2" stroke-linecap="round"/>`).join('');
  else hair=`<path d="M-11.5 0 Q-12 -19 0 -19.5 Q12 -19 11.5 0 Q7 -10 2 -10.5 Q-3 -9 -8 -8 Q-10 -6 -11.5 0Z" fill="${HC}"/>`;
  const face=`<path d="M-11 -2 Q-11 12 0 13 Q11 12 11 -2 Q11 -12 0 -12 Q-11 -12 -11 -2Z" fill="${sk}"/>`
    +`<path d="M-11 -2 Q-11 12 0 13 Q11 12 11 -2 Q11 -12 0 -12 Q-11 -12 -11 -2Z" fill="url(#gShade)" opacity=".4"/>`
    +`<ellipse cx="-6" cy="5" rx="3" ry="2" fill="#ff7b6b" opacity=".22"/><ellipse cx="6" cy="5" rx="3" ry="2" fill="#ff7b6b" opacity=".22"/>`;
  const ears=`<ellipse cx="-11.5" cy="1" rx="2.2" ry="3.2" fill="${sk}"/><ellipse cx="11.5" cy="1" rx="2.2" ry="3.2" fill="${sk}"/>`;
  const eyes=`<ellipse cx="-4.2" cy="0" rx="2.4" ry="1.9" fill="#fff"/><ellipse cx="4.2" cy="0" rx="2.4" ry="1.9" fill="#fff"/>`
    +`<circle cx="-4.2" cy="0.2" r="1.35" fill="${HC}"/><circle cx="4.2" cy="0.2" r="1.35" fill="${HC}"/>`
    +`<circle cx="-3.7" cy="-0.3" r=".45" fill="#fff"/><circle cx="4.7" cy="-0.3" r=".45" fill="#fff"/>`
    +`<path d="M-6.8 -3.4 Q-4.2 -5 -1.6 -3.4" stroke="${HC}" stroke-width="1" fill="none" stroke-linecap="round"/>`
    +`<path d="M1.6 -3.4 Q4.2 -5 6.8 -3.4" stroke="${HC}" stroke-width="1" fill="none" stroke-linecap="round"/>`;
  const nose=`<path d="M0 0.8 Q-1.4 3.6 0.7 4 Q1.5 4.1 2 3.5" stroke="#4a2f1b" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".7"/>`;
  const mouth=`<path d="M-3.6 7 Q0 9.4 3.6 7 Q0 8 -3.6 7Z" fill="#8e3b33"/><path d="M-3 7.2 Q0 7.8 3 7.2" stroke="#e8b4a0" stroke-width=".5" fill="none" opacity=".6"/>`;
  s+=`<g transform="translate(0,-101)"><g>${hb}${braids}${ears}${face}${hair}${eyes}${nose}${mouth}`
    +(p.s==='f'?`<circle cx="-11.5" cy="5" r="1.3" fill="#e0a526"/><circle cx="11.5" cy="5" r="1.3" fill="#e0a526"/>`:'')
    +`</g></g>`;
  return s;
}
function drawFig(p,x){
  const sc=p.sc||AGE_S[p.a]||1;
  return `<g transform="translate(${x},150) scale(${sc})">${figure(p)}</g>`;
}

const KEY='kelas_adventure_v10';
const SCL=0.8;
const ADS0={t1:'LEXARIS ACADÉMIE',t2:'Formation en IA · juristes et jeunes'};
const Qz=(q,c,a,exp)=>({q:q,c:c,a:a,exp:exp});
// Personnages et leurs énigmes (10 questions au total pour la leçon de l'école)
const NPC={
 lola:{where:'ext',x:70,name:'Mama Lola',role:'Gardienne du portail',p:{s:'f',a:'aine',w:1,c:'#e67e22',k:'pagne',co:'gris',g:'talk'},
  intro:['Bonjour, petit ! Le portail ne s’ouvre que pour ceux qui savent compter.','Réponds à mes trois questions et je te laisse entrer.'],
  qs:[Qz('Une cagette contient 8 mangues. Combien de mangues dans 5 cagettes ?',['30','35','40','45'],'40','5 × 8 = 40.'),
      Qz('Quel est le double de 17 ?',['27','34','37','32'],'34','17 × 2 = 34.'),
      Qz('Un sac de 25 mangues est partagé entre 5 enfants. Combien chacun reçoit-il ?',['4','5','6','7'],'5','25 ÷ 5 = 5.')],
  outro:'Bravo ! Le portail est ouvert. Entre et va voir la maîtresse dans la classe.'},
 ilunga:{where:'int',x:118,name:'Professeure Ilunga',role:'Maîtresse',needs:'lola',p:{s:'f',a:'adulte',w:.95,c:'#8e44ad',k:'boubou',co:'tresses',g:'talk'},
  intro:['Bienvenue à LEXARIS ACADÉMIE !','Aujourd’hui, la leçon porte sur la langue. Trois questions pour commencer.'],
  qs:[Qz('Hier, nous ___ au marché. (verbe aller)',['allons','sommes allés','irons','allerons'],'sommes allés','Au passé composé : nous sommes allés.'),
      Qz('Quel est l’antonyme de « ancien » ?',['vieux','nouveau','vieil','long'],'nouveau','Le contraire d’« ancien » est « nouveau ».'),
      Qz('Quel mot est un nom propre ?',['chien','Kinshasa','livre','maison'],'Kinshasa','Un nom propre désigne un lieu précis.')],
  outro:'Très bien ! Va t’asseoir près de Junior, il t’attend pour la géographie.'},
 junior:{where:'int',x:200,name:'Junior',role:'Élève',needs:'ilunga',sit:true,p:{s:'h',a:'enfant',w:.9,c:'#16a085',k:'uniforme',co:'courtes',g:'talk'},
  intro:['Salut ! La géographie, c’est mon sujet préféré.'],
  qs:[Qz('Quelle est la capitale de la RDC ?',['Lubumbashi','Goma','Kinshasa','Kisangani'],'Kinshasa','Kinshasa est la capitale de la RDC.'),
      Qz('Combien de provinces compte la RDC aujourd’hui ?',['11','15','26','30'],'26','Depuis 2015, la RDC compte 26 provinces.')],
  outro:'Bien joué ! Va voir le directeur, il veut te poser la dernière question.'},
 mavungu:{where:'int',x:266,name:'Directeur Mavungu',role:'Directeur',needs:'junior',p:{s:'h',a:'adulte',w:1,c:'#2c3e50',k:'uniforme',co:'courtes',g:'talk'},
  intro:['Tu as bien travaillé.','Une dernière question pour finir la leçon.'],
  qs:[Qz('En quelle année le Congo belge est-il devenu indépendant ?',['1948','1960','1965','1975'],'1960','L’indépendance date de 1960.'),
      Qz('Quel jour célèbre-t-on l’indépendance ?',['1er mai','30 juin','17 mai','4 décembre'],'30 juin','La fête de l’indépendance a lieu le 30 juin.')],
  outro:'Leçon terminée ! Tu gagnes des pièces et du tissu pour ta maison.'}
};
const AUTO=[['Jérémie','La leçon commence bientôt, tu viens ?'],['Petit Kasa','Mama Lola garde le portail, elle pose des questions !'],['Jérémie','Réponds bien et tu entreras dans la classe.'],['Petit Kasa','Moi, je connais déjà toutes les mangues !']];
const AUTOP={jer:{where:'ext',x:182,p:{s:'h',a:'ado',w:.95,c:'#27ae60',k:'uniforme',co:'courtes',g:'talk'}},kasa:{where:'ext',x:216,p:{s:'f',a:'enfant',w:.9,c:'#e0a526',k:'pagne',co:'nattes',g:'idle'}}};
const DOOR_X=265, EXIT_X=20;

let G={nom:'',sexe:'f',ext:true,x:30,dir:1,mv:false,mode:'start',dialog:null,keys:{l:false,r:false},
  adv:{done:{},good:0,total:0,pieces:0,tissu:0},greeted:{},near:null,autoI:0};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){G.nom=s.nom||'';G.sexe=s.sexe||'f';G.adv=Object.assign(G.adv,s.adv||{})}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({nom:G.nom,sexe:G.sexe,adv:G.adv}))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const doneNpc=id=>!!G.adv.done[id];
const locked=id=>{const n=NPC[id];return !!(n.needs&&!doneNpc(n.needs))};
const doorOpen=()=>doneNpc('lola');

// ---------- Décors ----------
function facade(){
  return `<rect x="148" y="92" width="156" height="58" fill="#f6efdc"/><rect x="148" y="92" width="156" height="58" fill="url(#gShade)" opacity=".4"/>`
   +`<path d="M140 94 L226 56 L312 94 Z" fill="url(#gRed)"/>`
   +`<rect x="170" y="96" width="112" height="13" rx="2" fill="#1f7a4d" stroke="#f1c40f" stroke-width="1.5"/>`
   +`<text x="226" y="106" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff" font-family="Arial,sans-serif">LEXARIS ACADÉMIE</text>`
   +`<rect x="162" y="112" width="24" height="16" fill="#9fd8ff" stroke="#fff" stroke-width="2"/><rect x="280" y="112" width="20" height="16" fill="#9fd8ff" stroke="#fff" stroke-width="2"/>`
   +`<line x1="308" y1="150" x2="308" y2="34" stroke="#777" stroke-width="2"/><rect x="309" y="36" width="10" height="16" fill="#2a7fd6"/>`;
}
function doorSvg(open){
  return `<rect x="252" y="118" width="26" height="32" fill="${open?'#2b1d12':'#5a3a22'}"/>`
    +(open?`<rect x="240" y="118" width="12" height="32" fill="#7a4a26" stroke="#4a2f1b"/>`:`<circle cx="274" cy="136" r="1.6" fill="#f1c40f"/>`);
}
function tree(x,base,r){return `<rect x="${x-3}" y="${base-22}" width="6" height="24" fill="#6b4226"/><circle cx="${x}" cy="${base-30}" r="${r}" fill="#2e8b57"/>`}
function bench(x1,x2){return `<rect x="${x1}" y="88" width="${x2-x1}" height="7" rx="2" fill="#7a4a26"/><rect x="${x1}" y="104" width="${x2-x1}" height="6" rx="2" fill="#a0683a"/><rect x="${x1+3}" y="110" width="4" height="40" fill="#6b4226"/><rect x="${x2-7}" y="110" width="4" height="40" fill="#6b4226"/>`}
function gate(){return `<rect x="128" y="120" width="4" height="30" fill="#6b4226"/><rect x="144" y="120" width="4" height="30" fill="#6b4226"/><line x1="132" y1="128" x2="144" y2="128" stroke="#6b4226" stroke-width="2"/><line x1="132" y1="142" x2="144" y2="142" stroke="#6b4226" stroke-width="2"/>`}
function billboard(){return `<line x1="30" y1="46" x2="30" y2="150" stroke="#6b6b6b" stroke-width="3"/><line x1="86" y1="46" x2="86" y2="150" stroke="#6b6b6b" stroke-width="3"/><rect x="12" y="20" width="92" height="26" rx="3" fill="#1f7a4d" stroke="#f1c40f" stroke-width="2.5"/><text x="58" y="36" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff" font-family="Arial,sans-serif">LEXARIS ACADÉMIE</text><text x="58" y="43" text-anchor="middle" font-size="5.5" fill="#f1c40f" font-family="Arial,sans-serif">${ADS0.t2}</text>`}
function sceneExt(){
  return `<rect width="320" height="190" fill="url(#gSkyE)"/><circle cx="290" cy="30" r="22" fill="url(#gSun)"/>${cloud(50,28)}${cloud(170,22)}`
    +`<rect y="150" width="320" height="40" fill="url(#gGrass)"/><rect y="150" width="320" height="8" fill="url(#gDirt)"/>`
    +tree(20,150,16)+tree(102,150,12)+billboard()+bench(40,70)+gate()+facade()
    +`<g id="door">${doorSvg(doorOpen())}</g>`;
}
function sceneInt(){
  return `<rect width="320" height="190" fill="#f3ead6"/><rect y="150" width="320" height="40" fill="url(#gDirt)"/>`
    +`<rect x="56" y="22" width="208" height="72" rx="4" fill="#2e3b33" stroke="#8d5a3b" stroke-width="6"/>`
    +`<text x="160" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" font-family="Arial,sans-serif">LEXARIS ACADÉMIE</text>`
    +`<text x="160" y="74" text-anchor="middle" font-size="9" fill="#f1c40f" font-family="Arial,sans-serif">Kelas Game · Apprendre en jouant</text>`
    +`<rect x="284" y="36" width="26" height="40" fill="#9fd8ff" stroke="#fff" stroke-width="3"/>`
    +`<rect x="6" y="96" width="30" height="54" fill="#7a4a26"/><rect x="28" y="120" width="3" height="3" fill="#f1c40f"/>`
    +desk(200)+desk(120)+desk(268);
}

// ---------- Personnage et scène ----------
function playerFig(mv){return figure({s:G.sexe,a:'enfant',w:1,skin:PEAUX[0],c:'#1f7a4d',k:'uniforme',co:G.sexe==='f'?'tresses':'courtes',g:mv?'walk':'idle'})}
function npcGroup(id){
  const n=NPC[id];
  const g=n.p.g||'talk';
  return `<g id="n-${id}">${drawFig(Object.assign({sc:AGE_S[n.p.a],sit:!!n.sit},n.p),n.x)}</g>`;
}
function autoGroup(id){const n=AUTOP[id];return `<g id="n-${id}">${drawFig(Object.assign({sc:AGE_S[n.p.a]},n.p),n.x)}</g>`}
function buildScene(){
  const ids=Object.keys(NPC).filter(k=>NPC[k].where===(G.ext?'ext':'int'));
  const auto=G.ext?Object.keys(AUTOP).filter(k=>AUTOP[k].where==='ext'):[];
  let npcs=ids.map(npcGroup).join('')+auto.map(autoGroup).join('');
  $('stage').innerHTML=`<svg viewBox="0 0 320 190" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%">${G.ext?sceneExt():sceneInt()}${npcs}<g id="pl"></g></svg>`;
  renderPlayer();
  placeDoor();
}
function placeDoor(){
  const d=$('door');if(d)d.innerHTML=doorSvg(doorOpen());
}
function renderPlayer(){const pl=$('pl');if(pl)pl.innerHTML=playerFig(G.mv)}
function setPlayerTransform(){
  const pl=$('pl');if(!pl)return;
  pl.setAttribute('transform',`translate(${G.x},150) scale(${G.dir*SCL},${SCL})`);
}
function greet(id){
  const n=NPC[id];const el=$('n-'+id);if(!el)return;
  el.innerHTML=drawFig(Object.assign({sc:AGE_S[n.p.a],sit:!!n.sit},n.p,{g:'wave'}),n.x);
  setTimeout(()=>{const e=$('n-'+id);if(e)e.innerHTML=drawFig(Object.assign({sc:AGE_S[n.p.a],sit:!!n.sit},n.p),n.x)},2500);
}
function bubble(text,x){
  const b=$('bubble');b.innerHTML=text;b.style.left=(x/320*100)+'%';b.style.display='block';
}
function hideBubble(){$('bubble').style.display='none'}

// ---------- Logique ----------
function nearbyTargets(){
  const out=[];
  if(G.ext){
    Object.keys(NPC).forEach(id=>{if(NPC[id].where==='ext'&&Math.abs(G.x-NPC[id].x)<36)out.push({t:'npc',id:id})});
    if(Math.abs(G.x-DOOR_X)<26)out.push({t:'door'});
  }else{
    Object.keys(NPC).forEach(id=>{if(NPC[id].where==='int'&&Math.abs(G.x-NPC[id].x)<36)out.push({t:'npc',id:id})});
    if(G.x<EXIT_X+22)out.push({t:'exit'});
  }
  return out;
}
function checkProximity(){
  const tg=nearbyTargets();
  const npcT=tg.find(t=>t.t==='npc');
  if(npcT&&G.near!==npcT.id){
    G.near=npcT.id;
    if(!G.greeted[npcT.id]){G.greeted[npcT.id]=true;greet(npcT.id);bubble('Bonjour '+esc(G.nom)+' !',NPC[npcT.id].x)}
  }
  if(!npcT&&G.near){G.near=null;hideBubble()}
  return tg;
}
function actionLabel(tg){
  const t=tg.find(x=>x.t==='npc')||tg.find(x=>x.t!=='npc');
  if(!t)return {label:'…',enabled:false,run:null};
  if(t.t==='npc'){
    const n=NPC[t.id];
    if(doneNpc(t.id))return {label:'Dire bonjour à '+n.name.split(' ')[0],enabled:true,run:()=>talkDone(t.id)};
    if(locked(t.id))return {label:n.name.split(' ')[0]+' est occupé',enabled:false,run:null};
    return {label:'Parler à '+n.name.split(' ')[0],enabled:true,run:()=>openDialog(t.id)};
  }
  if(t.t==='door'){
    return doorOpen()?{label:'Entrer dans l’école',enabled:true,run:enterInt}:{label:'Porte fermée',enabled:false,run:null};
  }
  return {label:'Sortir',enabled:true,run:exitInt};
}
function talkDone(id){
  bubble(esc(NPC[id].outro),NPC[id].x);
  setTimeout(hideBubble,3000);
}
function enterInt(){G.ext=false;G.x=60;G.dir=1;G.mv=false;buildScene();info('Tu es dans la classe.')}
function exitInt(){G.ext=true;G.x=DOOR_X-6;G.dir=-1;G.mv=false;buildScene();info('Tu es revenu devant l’école.')}
function info(t){$('info').textContent=t}

// Dialogues : lignes, puis questions une à une, puis conclusion
function openDialog(id){
  G.dialog={id:id,stage:'lines',i:0,qi:0,opts:null,wrong:null};
  G.mode='dialog';hideBubble();renderDialog();
}
function renderDialog(){
  const d=G.dialog,n=NPC[d.id],box=$('dlg');
  box.style.display='block';
  let h=`<h3>${esc(n.name)} · ${esc(n.role)}</h3>`;
  if(d.stage==='lines'){
    h+=`<p>${esc(n.intro[d.i])}</p><button class="p" onclick="nextLine()">Suite</button>`;
  }else if(d.stage==='q'){
    const q=n.qs[d.qi];
    if(!d.opts)d.opts=shuffle(q.c);
    h+=`<p><b>Question ${d.qi+1} sur ${n.qs.length}</b> : ${esc(q.q)}</p>`;
    if(d.wrong)h+=`<p class="ko">${esc(d.wrong)}</p>`;
    h+=d.opts.map((c,i)=>`<button onclick="answerQ(${i})">${esc(c)}</button>`).join('');
  }else{
    h+=`<p>${esc(n.outro)}</p><button class="p" onclick="finishDialog()">Continuer</button>`;
  }
  box.innerHTML=h;
}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function nextLine(){
  const d=G.dialog,n=NPC[d.id];
  d.i++;
  if(d.i>=n.intro.length){d.stage='q';d.qi=0;d.opts=null}
  renderDialog();
}
function answerQ(i){
  const d=G.dialog,n=NPC[d.id],q=n.qs[d.qi];
  const choice=d.opts[i];
  G.adv.total++;
  if(choice!==q.a){
    d.wrong='Pas tout à fait. '+q.exp+' Essaie encore.';
    d.wrongCount=(d.wrongCount||0)+1;
    G.adv.total--;
    renderDialog();return;
  }
  if(!d.wrong)G.adv.good++;
  d.wrong=null;
  d.qi++;d.opts=null;
  if(d.qi>=n.qs.length)d.stage='out';
  renderDialog();
}
function finishDialog(){
  const d=G.dialog,id=d.id;
  G.adv.done[id]=true;
  if(id==='mavungu'){G.adv.pieces+=20;G.adv.tissu+=2}
  save();
  $('dlg').style.display='none';
  G.dialog=null;G.mode='play';
  placeDoor();
  info(NPC[id].name+' : leçon validée. '+lessonLine());
}
function lessonLine(){
  const done=Object.keys(G.adv.done).length;
  return 'Questions bien répondues : '+G.adv.good+' · Étapes : '+done+'/4 · Pièces : '+G.adv.pieces+' · Tissu : '+G.adv.tissu;
}

// ---------- Boucle et commandes ----------
function tick(){
  if(G.mode!=='play')return;
  const dx=(G.keys.l?-1:0)+(G.keys.r?1:0);
  G.x=Math.max(8,Math.min(312,G.x+dx*1.8));
  if(dx)G.dir=dx;
  const mv=dx!==0;
  if(mv!==G.mv){G.mv=mv;renderPlayer()}
  setPlayerTransform();
  const tg=checkProximity();
  const a=actionLabel(tg);
  const b=$('ba');
  if(b.textContent!==a.label)b.textContent=a.label;
  b.disabled=!a.enabled;
  b.dataset.run=a.enabled?'1':'';
  G._run=a.run;
}
function act(){if(G.mode==='play'&&G._run)G._run()}
function bindCtl(el,k){
  const on=e=>{e.preventDefault();G.keys[k]=true};
  const off=e=>{e.preventDefault();G.keys[k]=false};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
bindCtl($('bl'),'l');bindCtl($('br'),'r');
$('ba').addEventListener('click',act);
document.addEventListener('keydown',e=>{
  if(G.mode!=='play')return;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='q')G.keys.l=true;
  if(e.key==='ArrowRight'||e.key==='d')G.keys.r=true;
  if(e.key==='e'||e.key==='Enter'||e.key===' ')act();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='q')G.keys.l=false;
  if(e.key==='ArrowRight'||e.key==='d')G.keys.r=false;
});
let autoIdx=0;
function autoTalk(){
  if(!G.ext||G.mode!=='play')return;
  const [name,text]=AUTO[autoIdx%AUTO.length];autoIdx++;
  const x=name==='Jérémie'?AUTOP.jer.x:AUTOP.kasa.x;
  if(G.near)return;
  bubble('<b>'+esc(name)+'</b> : '+esc(text),x);
  clearTimeout(G._hb);G._hb=setTimeout(()=>{if(!G.near)hideBubble()},3800);
}
setInterval(tick,50);
setInterval(autoTalk,4500);
$('fille').onclick=()=>{G.sexe='f';$('fille').className='p';$('garcon').className=''};
$('garcon').onclick=()=>{G.sexe='h';$('garcon').className='p';$('fille').className=''};
$('go').onclick=()=>{
  const n=$('nom').value.trim();
  if(!n){$('nom').focus();return}
  G.nom=n;save();
  $('start').classList.add('hide');
  G.mode='play';buildScene();info(lessonLine());
};
load();
if(G.nom){$('nom').value=G.nom;$('start').classList.add('hide');G.mode='play';buildScene();info(lessonLine())}
else{$('nom').value=''}
$('fille').className=G.sexe==='f'?'p':'';$('garcon').className=G.sexe==='h'?'p':'';

</script>
