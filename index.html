<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kelas Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="world">
  <canvas id="cv"></canvas>
  <div id="top" class="hud"><span id="stats"></span><button id="menu" aria-label="Menu">☰</button></div>
  <div id="info" class="hud"></div>
  <div id="bubble"></div>
  <div id="toast"></div>
  <div id="joy" class="hide"><div id="knob"></div></div>
  <div id="actwrap" class="hide"><div id="alabel"></div><button id="ba" disabled>Action</button></div>
  <div id="cine" class="hide"><h1>KELAS GAME</h1><p>LEXARIS ACADÉMIE · Apprendre en jouant</p></div>
  <button id="skip" class="hide">Passer</button>
  <div id="creator" class="hide"></div>
  <div id="dlg"></div>
  <div id="start" class="hide">
    <div class="card">
      <h2>Kelas Game</h2>
      <p>Explore le village en 3D, réponds aux questions de l’école, gagne des pièces et meuble ta maison.</p>
      <button id="cont" class="p hide"></button>
      <input id="nom" maxlength="14" placeholder="Ton prénom" autocomplete="off">
      <div class="row"><button id="fille" class="p">Une fille</button><button id="garcon">Un garçon</button></div>
      <button id="go" class="p">Créer mon personnage</button>
    </div>
  </div>
  <div id="load">Chargement du village…<i><b id="lb"></b></i></div>
</div>
<script src="dist/game.js"></script>
</body>
</html>
